<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Sagrada Família — 3D Construction Timeline (1882–2026+)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-hud: rgba(20, 23, 28, 0.92);
      --border-hud: rgba(255, 245, 225, 0.15);
      --ink: #f7f3eb;
      --ink-muted: #cfc7b8;
      --ink-dim: #a79f91;
      --accent: #e0a458;
      --accent-hover: #eab46e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #e4d4c0; color: var(--ink);
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      user-select: none;
    }
    #canvas-host {
      position: fixed; inset: 0; width: 100%; height: 100%;
      cursor: grab;
    }
    #canvas-host:active { cursor: grabbing; }

    .info-card {
      position: fixed; top: 16px; left: 16px; z-index: 10;
      width: 332px; max-width: calc(100vw - 32px);
      border-radius: 12px; background: var(--bg-hud);
      border: 1px solid var(--border-hud);
      box-shadow: 0 20px 45px rgba(0,0,0,0.35);
    }
    .info-header {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 16px; border-bottom: 1px solid rgba(255,245,225,0.1);
    }
    .info-title {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 20px; font-weight: 600; line-height: 1.15; color: var(--ink);
    }
    .info-meta {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: var(--ink-muted); margin-top: 2px;
    }
    .mono { font-family: "JetBrains Mono", monospace; font-variant-numeric: tabular-nums; }
    .icon-btn {
      width: 34px; height: 34px; border-radius: 8px; border: none;
      background: transparent; color: var(--ink-muted); cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 14px; transition: background 0.15s, color 0.15s;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .info-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
    .info-body.hidden { display: none; }
    .year-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .year-big {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 38px; font-weight: 600; line-height: 1; color: var(--accent);
      font-variant-numeric: tabular-nums;
    }
    .architect-box { text-align: right; }
    .architect-label { font-size: 11px; color: var(--ink-dim); }
    .architect-name { font-size: 13px; font-weight: 500; color: var(--ink); }
    .era-title { font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
    .era-summary { font-size: 12.5px; line-height: 1.5; color: #d4cdbf; }
    .phases-list {
      padding-top: 8px; border-top: 1px solid rgba(255,245,225,0.1);
      display: flex; flex-direction: column; gap: 4px;
    }
    .phase-btn {
      width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 6px 8px; border-radius: 6px; border: none; background: transparent;
      color: var(--ink-muted); font-size: 12px; cursor: pointer; text-align: left;
      transition: background 0.15s, color 0.15s;
    }
    .phase-btn:hover { background: rgba(255,255,255,0.06); color: #fff; }
    .phase-btn.active { background: rgba(255,255,255,0.1); color: #fff; }
    .phase-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .swatch { width: 10px; height: 10px; border-radius: 2px; border: 1px solid rgba(255,255,255,0.2); flex-shrink: 0; }

    .dock-wrap {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 10;
      width: min(940px, 95vw); display: flex; flex-direction: column; align-items: center;
      pointer-events: none;
    }
    .narration-caption {
      pointer-events: auto; margin-bottom: 8px; max-width: min(740px, 92vw);
      padding: 8px 16px; border-radius: 8px; background: var(--bg-hud);
      border: 1px solid rgba(224,164,88,0.35); color: var(--ink);
      font-size: 12.5px; line-height: 1.4; text-align: center;
      box-shadow: 0 10px 24px rgba(0,0,0,0.32);
    }
    .narration-caption.hidden { display: none; }
    .dock-toggle {
      pointer-events: auto; margin-bottom: 4px; padding: 4px 12px;
      border-radius: 8px 8px 6px 6px; background: var(--bg-hud);
      border: 1px solid var(--border-hud); color: var(--ink-muted);
      font-size: 11px; font-weight: 500; cursor: pointer;
    }
    .dock-toggle:hover { color: #fff; }
    .dock {
      pointer-events: auto; width: 100%; border-radius: 12px;
      background: var(--bg-hud); border: 1px solid var(--border-hud);
      box-shadow: 0 20px 45px rgba(0,0,0,0.4);
      padding: 10px 14px; display: flex; flex-direction: column; gap: 8px;
    }
    .dock.hidden { display: none; }
    .dock-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .play-btn {
      min-height: 38px; padding: 0 16px; border-radius: 8px; border: none;
      background: var(--accent); color: #14171c; font-weight: 600; font-size: 12px;
      cursor: pointer; white-space: nowrap; flex-shrink: 0;
    }
    .play-btn:hover { background: var(--accent-hover); }
    .slider-wrap { flex: 1; min-width: 150px; display: flex; align-items: center; gap: 10px; }
    input[type="range"] {
      -webkit-appearance: none; appearance: none; width: 100%; height: 24px;
      background-color: transparent; cursor: pointer;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 6px; border-radius: 3px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
      border-radius: 50%; background: #f7f3eb; border: 2.5px solid var(--accent);
      margin-top: -5px; box-shadow: 0 2px 6px rgba(0,0,0,0.45);
    }
    .ctrl-btn {
      min-height: 38px; padding: 0 12px; border-radius: 8px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      color: var(--ink-muted); font-size: 12px; font-weight: 500;
      cursor: pointer; white-space: nowrap; flex-shrink: 0;
    }
    .ctrl-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
    .ctrl-btn.active {
      background: rgba(224,164,88,0.2); border-color: rgba(224,164,88,0.6); color: #f6cf92;
    }
    .milestones-row {
      display: flex; align-items: center; gap: 6px; overflow-x: auto;
      padding-top: 6px; border-top: 1px solid rgba(255,245,225,0.1);
    }
    .era-btn {
      flex: 1; min-width: fit-content; padding: 6px 10px; border-radius: 8px;
      border: 1px solid transparent; background: rgba(255,255,255,0.05);
      color: var(--ink-muted); font-size: 12px; font-weight: 500;
      cursor: pointer; white-space: nowrap; flex-shrink: 0;
    }
    .era-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .era-btn.active {
      background: rgba(224,164,88,0.2); border-color: rgba(224,164,88,0.5); color: #f6cf92;
    }
    .closeup-card {
      position: fixed; top: 16px; right: 16px; z-index: 10;
      width: 356px; max-width: calc(100vw - 32px); max-height: calc(100vh - 168px); overflow-y: auto;
      background: var(--bg-hud); border: 1px solid rgba(224,164,88,0.35);
      border-radius: 12px; box-shadow: 0 20px 45px rgba(0,0,0,0.45);
    }
    .closeup-card.hidden { display: none; }
    .closeup-trivia { padding-top: 8px; border-top: 1px solid rgba(255,245,225,0.1); list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .closeup-trivia li { display: flex; gap: 8px; font-size: 11.5px; line-height: 1.38; color: #d4cdbf; }
    .labels-layer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
    .pin-3d {
      position: fixed; top: 0; left: 0; transform: translate3d(-999px, -999px, 0);
      margin-left: 0; margin-top: 0; background: none; border: none; padding: 0 0 8px 0;
      cursor: pointer; pointer-events: none; opacity: 0; transition: opacity 0.15s;
      display: flex; flex-direction: column; align-items: center;
      margin: -34px 0 0 -55px;
    }
    .pin-3d-tag {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px;
      border-radius: 6px; background: rgba(20,23,28,0.9); color: #f7f3eb;
      border: 1px solid rgba(255,245,225,0.22); font-size: 11px; font-weight: 500;
      white-space: nowrap; box-shadow: 0 6px 16px rgba(0,0,0,0.35);
    }
    .pin-3d.active .pin-3d-tag { background: #e0a458; color: #14171c; border-color: #fff5e1; }
    .pin-3d-dot { width: 6px; height: 6px; transform: rotate(45deg); background: #e0a458; }
    .pin-3d.active .pin-3d-dot { background: #14171c; }
    .pin-3d-stem { width: 1px; height: 9px; background: rgba(255,245,225,0.45); }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-host" aria-label="Interactive 3D architectural visualization of La Sagrada Família"></div>
  <div id="labels-layer" class="labels-layer" aria-label="Annotated 3D architectural labels"></div>

  <aside class="info-card" aria-label="Historical construction details">
    <div class="info-header">
      <div>
        <h1 class="info-title">La Sagrada Família</h1>
        <div class="info-meta">
          <span>Barcelona</span><span aria-hidden="true">·</span>
          <span>1882–2026+</span><span aria-hidden="true">·</span>
          <span id="pct-built" class="mono" style="color:var(--accent)">0% Built</span>
        </div>
      </div>
      <button id="info-collapse-btn" class="icon-btn" type="button" aria-label="Toggle info card">▾</button>
    </div>
    <div id="info-body" class="info-body">
      <div class="year-row">
        <div id="year-display" class="year-big">1926</div>
        <div class="architect-box">
          <div class="architect-label">Active Architect</div>
          <div id="architect-name" class="architect-name">Antoni Gaudí</div>
        </div>
      </div>
      <div>
        <h2 id="era-title" class="era-title"></h2>
        <p id="era-summary" class="era-summary"></p>
      </div>
      <div class="phases-list" id="phases-list"></div>
    </div>
  </aside>

  <aside id="closeup-card" class="closeup-card hidden" aria-label="Close-up architectural detail">
    <div class="info-header">
      <div>
        <div class="info-meta"><span style="color:var(--accent)">Close-up Detail</span><span aria-hidden="true">·</span><span id="cu-era"></span></div>
        <h2 id="cu-title" class="info-title" style="font-size:20px;margin-top:2px"></h2>
      </div>
      <div style="display:flex;gap:4px">
        <button id="cu-prev-btn" class="icon-btn" type="button" aria-label="Previous landmark">‹</button>
        <button id="cu-next-btn" class="icon-btn" type="button" aria-label="Next landmark">›</button>
        <button id="cu-close-btn" class="icon-btn" type="button" aria-label="Close close-up detail">✕</button>
      </div>
    </div>
    <div class="info-body">
      <div style="font-size:11.5px;color:var(--ink-dim)">Lead Architect <strong id="cu-arch" style="color:var(--ink);font-weight:500"></strong></div>
      <div id="cu-dims" class="mono" style="font-size:11.5px;color:var(--ink-muted)"></div>
      <p id="cu-summary" class="era-summary"></p>
      <ol id="cu-trivia" class="closeup-trivia"></ol>
    </div>
  </aside>

  <div class="dock-wrap">
    <div id="narration-caption" class="narration-caption hidden" role="status" aria-live="polite" data-testid="narration-caption"></div>
    <button id="dock-toggle-btn" class="dock-toggle" type="button">▾ Hide Controls</button>
    <section id="dock-panel" class="dock" aria-label="Timeline playback and camera controls">
      <div class="dock-row">
        <button id="play-btn" class="play-btn" type="button">Play</button>
        <div class="slider-wrap">
          <input id="year-slider" type="range" min="1882" max="2026" step="0.25" value="1926" aria-label="Construction year" />
          <span id="slider-year" class="mono" style="font-size:13px;width:46px;text-align:right">1926</span>
        </div>
        <button id="focus-btn" class="ctrl-btn" type="button" aria-pressed="false">Focus</button>
        <button id="labels-btn" class="ctrl-btn active" type="button" aria-pressed="true">Labels</button>
        <button id="narrate-btn" class="ctrl-btn" type="button" aria-pressed="false" aria-label="Enable voice narration">Narrate</button>
        <button id="orbit-btn" class="ctrl-btn" type="button" aria-pressed="false">Auto-Orbit</button>
        <button id="reset-btn" class="ctrl-btn" type="button">Reset</button>
      </div>
      <div class="milestones-row" id="tod-row" style="padding-top:6px;flex-wrap:wrap">
        <span style="font-size:11px;color:var(--ink-dim);margin-right:4px;white-space:nowrap">Time of Day</span>
        <button class="era-btn" type="button" data-tod="day">Daylight</button>
        <button class="era-btn active" type="button" data-tod="dusk">Golden Hour</button>
        <button class="era-btn" type="button" data-tod="night">Night</button>
        <button id="tod-cycle-btn" class="ctrl-btn" type="button" style="min-height:30px;padding:0 10px" aria-pressed="false">Cycle</button>
        <select id="weather-select" class="ctrl-btn" style="min-height:30px;padding:0 8px;background:#1f242c" aria-label="Atmospheric weather effect">
          <option value="auto">Weather: Auto</option>
          <option value="rain">Light Rain</option>
          <option value="fog">Drifting Mist</option>
          <option value="clear">Clear Sky</option>
        </select>
        <button id="birds-btn" class="ctrl-btn active" type="button" style="min-height:30px;padding:0 10px" aria-pressed="true">Birds</button>
      </div>
      <div class="milestones-row" id="milestones-row"></div>
    </section>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const MIN_YEAR = 1882, MAX_YEAR = 2026;
    const PHASES = [
      { id: 'phase1', label: 'Crypt, Apse & Nativity', endYear: 1929, color: '#d4b483' },
      { id: 'phase2', label: 'Passion Facade', endYear: 1976, color: '#d8d2c7' },
      { id: 'phase3', label: 'Central Nave & Vaults', endYear: 2010, color: '#e3c79c' },
      { id: 'phase4', label: 'Central Towers & Glory', endYear: 2026, color: '#f1d693' },
    ];
    const MILESTONES = [
      { id: 's1882', year: 1882, label: '1882 Start', cam: [140, 22, 72] },
      { id: 'g1926', year: 1926, label: "1926 Gaudí's Death", cam: [62, 18, 74] },
      { id: 'p1976', year: 1976, label: '1976 Passion Towers', cam: [-66, 19, 76] },
      { id: 'c2010', year: 2010, label: '2010 Consecration', cam: [38, 22, 78] },
      { id: 'f2026', year: 2026, label: '2026 Completion', cam: [42, 15, 108] },
    ];
    const SEGMENTS = [
      {
        id: '1882–1883',
        from: 1882, to: 1884, title: 'Neo-Gothic Crypt Foundations', architect: 'Francisco de Paula del Villar', phase: 'phase1',
        summary: 'Construction began in March 1882 under diocesan architect Francisco de Paula del Villar with a Neo-Gothic crypt beneath the apse. Within a year, thirty-one-year-old Antoni Gaudí assumed leadership and completely transformed the basilica’s structural vision.',
        narration: '1882. Work begins under Francisco de Paula del Villar with a Neo-Gothic crypt, before young Antoni Gaudí takes over and transforms the entire vision.'
      },
      {
        id: '1884–1906',
        from: 1884, to: 1906, title: 'Crypt Completion & Radiating Apse', architect: 'Antoni Gaudí', phase: 'phase1',
        summary: 'Gaudí vaulted the crypt and raised the polygonal Neo-Gothic apse walls with seven radiating chapels and towering outer pinnacles. During this era he developed hanging chain models to calculate catenary equilibrium.',
        narration: '1884 to 1906. Gaudí completes the crypt and raises the seven radiating apse chapels, using hanging chain models to shape every stone arch.'
      },
      {
        id: '1906–1926',
        from: 1906, to: 1926.9, title: 'Nativity Facade & Bell Towers', architect: 'Antoni Gaudí', phase: 'phase1',
        summary: 'Focusing all energy on the eastern Nativity Facade, Gaudí sculpted three richly detailed portals beneath the Cypress Tree of Life and raised its four parabolic bell towers. By his death in June 1926, the first tower stood complete and the remaining three were well underway.',
        narration: '1906 to 1926. Gaudí sculpts the Nativity Facade and its first parabolic bell towers, leaving plaster models behind upon his passing in 1926.'
      },
      {
        id: '1926–1951',
        from: 1926.9, to: 1952, title: 'Completion of Nativity & Wartime Pause', architect: 'Domènec Sugrañes · Francesc Quintana', phase: 'phase1',
        summary: 'Domènec Sugrañes finished the remaining three Nativity bell towers by 1930 before the Spanish Civil War halted work and damaged Gaudí’s models. During the 1940s, architects pieced back the shattered plaster prototypes to resume work.',
        narration: '1926 to 1951. Gaudí’s disciples finish the Nativity spires by 1930, then carefully reconstruct his shattered workshop models after the war.'
      },
      {
        id: '1952–1976',
        from: 1952, to: 1976.9, title: 'Passion Facade & Bone-Like Pillars', architect: 'Francesc Quintana, Isidre Puig Boada & Lluís Bonet', phase: 'phase2',
        summary: 'Work opened on the western transept with the stark, austere Passion Facade, anchored by six inclined bone-like buttress columns supporting a severe cornice. By 1976 all four angular geometric bell towers rose to 112 meters.',
        narration: '1952 to 1976. Across the western transept, the stark Passion Facade rises with six inclined bone-like pillars and four angular bell towers.'
      },
      {
        id: '1978–1995',
        from: 1976.9, to: 1995, title: 'Nave Walls & Forest Columns Begin', architect: 'Jordi Bonet i Armengol', phase: 'phase3',
        summary: 'Builders shifted to the vast central nave, raising outer clerestory walls alongside double-twisted tree columns. Early CAD modeling translated Gaudí’s complex ruled hyperboloid geometries into stone formwork.',
        narration: '1978 to 1995. Guided by early computer modeling, builders raise the nave walls and plant a forest of double-twisted stone columns inside.'
      },
      {
        id: '1995–2010',
        from: 1995, to: 2010.5, title: 'Hyperboloid Vaults & Consecration', architect: 'Jordi Bonet i Armengol', phase: 'phase3',
        summary: 'Branching stone canopies interlocked into luminous hyperboloid vaults 45 meters above the nave floor, enclosing the roof and jewel-toned stained glass. In November 2010, Pope Benedict XVI consecrated the church as a Minor Basilica.',
        narration: '1995 to 2010. Branching stone canopies lock into luminous hyperboloid vaults, enclosing the stained-glass nave for its 2010 consecration.'
      },
      {
        id: '2010–2021',
        from: 2010.5, to: 2021.9, title: 'Evangelist & Virgin Mary Towers', architect: 'Jordi Faulí i Oller', phase: 'phase4',
        summary: 'Using prefabricated post-tensioned stone panels, Jordi Faulí’s team accelerated construction of the six central towers. In December 2021, the 138-meter Tower of the Virgin Mary was crowned with an illuminated twelve-pointed star.',
        narration: '2010 to 2021. Post-tensioned stone panels accelerate the central cluster, crowning the Tower of the Virgin Mary with a glowing twelve-pointed star.'
      },
      {
        id: '2022–2026+',
        from: 2021.9, to: 2027, title: 'Tower of Jesus Christ & Glory Facade', architect: 'Jordi Faulí i Oller', phase: 'phase4',
        summary: 'With winged tetramorph sculptures crowning the four Evangelist towers, the central Tower of Jesus Christ ascended to 172.5 meters topped by its four-armed glazed cross. Marking the 2026 centenary of Gaudí’s passing, work advances on the monumental Glory Facade.',
        narration: '2022 to 2026 and beyond. The four winged Evangelist towers and the 172-meter Tower of Jesus Christ crown the skyline as work turns toward the Glory Facade.'
      },
    ];

    const clamp01 = (v) => Math.max(0, Math.min(1, v));
    const smooth01 = (t) => { const x = clamp01(t); return x * x * (3 - 2 * x); };
    const prog = (y, a, b) => smooth01((y - a) / (b - a));
    function getProgress(y) {
      const crypt = prog(y, 1882, 1891), apse = prog(y, 1888, 1904);
      const nativityBody = prog(y, 1898, 1918), nativityTowers = prog(y, 1912, 1929);
      const phase1 = prog(y, 1882, 1929);
      const passionBody = prog(y, 1952, 1966), passionTowers = prog(y, 1962, 1976);
      const phase2 = prog(y, 1952, 1976);
      const naveWalls = prog(y, 1978, 1998), naveVaults = prog(y, 1992, 2009);
      const stainedGlassGlow = prog(y, 2004, 2011), phase3 = prog(y, 1978, 2010);
      const virginMaryTower = prog(y, 2014, 2021.8), evangelistTowers = prog(y, 2015, 2023.8);
      const jesusTower = prog(y, 2016, 2026), gloryFacade = prog(y, 2018, 2026);
      const phase4 = prog(y, 2011, 2026);
      const pct = Math.round((phase1 * 0.25 + phase2 * 0.2 + phase3 * 0.27 + phase4 * 0.28) * 100);
      return { phase1, phase2, phase3, phase4, crypt, apse, nativityBody, nativityTowers, passionBody, passionTowers, naveWalls, naveVaults, stainedGlassGlow, virginMaryTower, evangelistTowers, jesusTower, gloryFacade, pct };
    }

    // WebGL Setup
    const host = document.getElementById('canvas-host');
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.92;
    renderer.localClippingEnabled = true;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    host.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const horizonHex = 0xe4d4c0;
    const fog = new THREE.FogExp2(horizonHex, 0.0042);
    scene.background = new THREE.Color(horizonHex);
    scene.fog = fog;

    // Sky Dome Shader

    function computeStackTransform(progress, start, end, dropHeight = 5.5, mode = 'drop') {
      if (progress <= start) return { visible: false, offsetY: dropHeight, scaleXY: 0.72, scaleY: 0.02 };
      if (progress >= end) return { visible: true, offsetY: 0, scaleXY: 1, scaleY: 1 };
      const u = Math.max(0, Math.min(1, (progress - start) / Math.max(0.0001, end - start)));
      const easeOut = 1 - Math.pow(1 - u, 3);
      if (mode === 'growY') return { visible: true, offsetY: 0, scaleXY: 0.92 + 0.08 * easeOut, scaleY: 0.04 + 0.96 * easeOut };
      if (mode === 'pop') return { visible: true, offsetY: (1 - easeOut) * dropHeight * 0.35, scaleXY: 0.4 + 0.6 * easeOut, scaleY: 0.4 + 0.6 * easeOut };
      return { visible: true, offsetY: (1 - easeOut) * dropHeight, scaleXY: 0.78 + 0.22 * easeOut, scaleY: 0.65 + 0.35 * easeOut };

    function buildHDTower(phase, x, z, baseY, h, r0, r1, segs, ribs, louvers, sMat, rMat, fMat, aMat, angular, stagger = 0) {

      const drumTiers = 8;
      for (let k = 0; k < drumTiers; k++) {
        const t0 = k / drumTiers, t1 = (k + 1) / drumTiers;

        const dStart = Math.min(0.7, stagger + (k / drumTiers) * 0.56 + 0.04);
        regPart(phase, dm, dStart, Math.min(0.84, dStart + 0.15), 5.2, 'drop');

      const ribGeo = new THREE.BoxGeometry(0.16, h * 0.94, 0.28);

        rib.rotation.y = -ang; rib.rotation.z = lean; g.add(rib);
        regPart(phase, rib, stagger + 0.1, Math.min(0.86, stagger + 0.74), 0, 'growY', h * 0.47);
      }

      for (let b = 0; b < louvers; b++) {
        const frac = 0.16 + (b / louvers) * 0.78;
        const r = THREE.MathUtils.lerp(r0, r1, Math.pow(frac, 0.72));
        const yPos = 2.4 + frac * h;
        const bStart = Math.min(0.74, stagger + 0.08 + (b / Math.max(1, louvers - 1)) * 0.56);
        const bEnd = Math.min(0.86, bStart + 0.14);
        const slot = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.99, r * 1.01, 0.34, segs), rMat);

        regPart(phase, pyr, Math.min(0.86, crStart + 0.05), Math.min(0.96, crStart + 0.14), 5.0, 'drop');
        const sp = new THREE.Mesh(new THREE.ConeGeometry(r1 * 0.48, 1.55, 4), aMat);
        sp.position.y = cy + 3.2; g.add(sp);
        regPart(phase, sp, Math.min(0.9, crStart + 0.08), 1.0, 4.8, 'drop');

        regPart(phase, orb, Math.min(0.86, crStart + 0.05), Math.min(0.96, crStart + 0.14), 5.0, 'drop');
        const spGeo = new THREE.ConeGeometry(r1 * 0.22, r1 * 1.5, 4);

          sp.position.set(Math.cos(ang) * r1 * 1.05, cy + 1.7, Math.sin(ang) * r1 * 1.05);
          sp.rotation.z = -Math.cos(ang) * (Math.PI / 2); sp.rotation.x = Math.sin(ang) * (Math.PI / 2); g.add(sp);

      starMesh.rotation.y = elapsed * 0.25;

      mGoldNat.emissiveIntensity = atmos.spireGlow * 1.15;
      mWhiteNat.emissiveIntensity = atmos.spireGlow * 0.65;
      mFinPas.emissiveIntensity = atmos.spireGlow * 0.72;
      mFinEvan.emissiveIntensity = atmos.spireGlow * 1.1;
      mCross.emissiveIntensity = 0.55 + atmos.spireGlow * 1.85;
      rNat.emissiveIntensity = p.nativityTowers * atmos.spireGlow * 0.85;
      rPas.emissiveIntensity = p.passionTowers * atmos.spireGlow * 0.65;
      rNave.emissiveIntensity = p.stainedGlassGlow * atmos.spireGlow * 0.6;
      rEvan.emissiveIntensity = p.evangelistTowers * atmos.spireGlow * 0.92;
      rMary.emissiveIntensity = p.virginMaryTower * atmos.spireGlow * 0.96;
      rJesus.emissiveIntensity = p.jesusTower * atmos.spireGlow * 1.05;
      rGlory.emissiveIntensity = p.gloryFacade * atmos.spireGlow * 0.85;
      mEix.emissiveIntensity = atmos.cityGlow * 1.05;
      mLampGlow.emissiveIntensity = 0.12 + atmos.duskF * 0.85 + atmos.nightF * 1.85;
      upNat.intensity = Math.max(p.nativityBody * 0.6, p.nativityTowers) * atmos.uplight * 26;
      upPas.intensity = Math.max(p.passionBody * 0.6, p.passionTowers) * atmos.uplight * 22;
      upCen.intensity = Math.max(p.evangelistTowers, p.jesusTower) * atmos.uplight * 34;

      craneNat.g.visible = p.nativityTowers > 0.02 && p.nativityTowers < 0.985;
      craneNat.jib.rotation.y = Math.sin(elapsed * 0.45) * 0.85;
      cranePas.g.visible = p.passionTowers > 0.02 && p.passionTowers < 0.985;
      cranePas.jib.rotation.y = Math.cos(elapsed * 0.4) * 0.8;
      craneCen.g.visible = p.evangelistTowers > 0.02 && p.jesusTower < 0.985;
      craneCen.jib.rotation.y = elapsed * 0.35;

      const label = Math.round(year) >= MAX_YEAR ? '2026+' : String(Math.round(year));
      yearDisp.textContent = label; sliderYear.textContent = label;
      slider.value = String(year);
      const sPct = ((year - MIN_YEAR) / (MAX_YEAR - MIN_YEAR)) * 100;
      slider.style.backgroundImage = `linear-gradient(to right, #e0a458 0%, #e0a458 ${sPct}%, rgba(255,245,225,0.18) ${sPct}%, rgba(255,245,225,0.18) 100%)`;
      slider.style.backgroundSize = '100% 6px'; slider.style.backgroundRepeat = 'no-repeat'; slider.style.backgroundPosition = 'center';
      pctBuilt.textContent = `${p.pct}% Built`;

      const seg = getSegmentForYear(year);
      archName.textContent = seg.architect; eraTitle.textContent = seg.title; eraSummary.textContent = seg.summary;
      if (narrationEnabled && isPlaying) speakSegmentIfNeeded(year, false);

      phasesList.innerHTML = PHASES.map((ph) => `
        <button class="phase-btn ${seg.phase === ph.id ? 'active' : ''}" data-end="${ph.endYear}">
          <span class="phase-left"><span class="swatch" style="background:${ph.color}"></span><span>${ph.label}</span></span>
          <span class="mono" style="font-size:11px;color:#b9b1a3">${Math.round(p[ph.id] * 100)}%</span>
        </button>`).join('');
      phasesList.querySelectorAll('.phase-btn').forEach((b) => {
        b.onclick = () => {
          isPlaying = false; playBtn.textContent = 'Play';
          year = Math.min(MAX_YEAR, Number(b.dataset.end));
          if (narrationEnabled) speakSegmentIfNeeded(year, true);
        };
      });
      milestonesRow.querySelectorAll('.era-btn').forEach((b) => {
        b.classList.toggle('active', Math.abs(year - Number(b.dataset.year)) < 1.5);
      });
    }

    MILESTONES.forEach((m) => {
      const btn = document.createElement('button');
      btn.className = 'era-btn'; btn.type = 'button'; btn.textContent = m.label; btn.dataset.year = String(m.year);
      btn.onclick = () => {
        isPlaying = false; playBtn.textContent = 'Play'; year = m.year; selectedFeatureId = null; cuCard.classList.add('hidden');
        const [az, el, d] = m.cam.map((v, idx) => idx < 2 ? THREE.MathUtils.degToRad(v) : v);
        camGoal = { pos: new THREE.Vector3(Math.sin(az) * d * Math.cos(el), TARGET.y + d * Math.sin(el), Math.cos(az) * d * Math.cos(el)), tgt: TARGET.clone() };
        if (narrationEnabled) speakSegmentIfNeeded(year, true);
      };
      milestonesRow.appendChild(btn);
    });

    narrateBtn.onclick = () => {
      narrationEnabled = !narrationEnabled;
      narrationBtnState();
    };
    function narrationBtnState() {
      narrateBtn.classList.toggle('active', narrationEnabled);
      narrateBtn.setAttribute('aria-pressed', String(narrationEnabled));
      narrateBtn.setAttribute('aria-label', narrationEnabled ? 'Mute voice narration' : 'Enable voice narration');
      if (narrationEnabled) speakSegmentIfNeeded(year, true);
      else { stopNarrationSpeech(); captionEl.classList.add('hidden'); }
    }

    playBtn.onclick = () => {
      if (!isPlaying && year >= MAX_YEAR - 0.1) year = MIN_YEAR;
      isPlaying = !isPlaying; playBtn.textContent = isPlaying ? 'Pause' : 'Play';
      if (isPlaying && narrationEnabled) speakSegmentIfNeeded(year, true);
      else if (!isPlaying) stopNarrationSpeech();
    };
    slider.oninput = (e) => {
      isPlaying = false; playBtn.textContent = 'Play'; year = parseFloat(e.target.value);
      if (narrationEnabled) speakSegmentIfNeeded(year, false);
    };
    orbitBtn.onclick = () => { autoOrbit = !autoOrbit; orbitBtn.classList.toggle('active', autoOrbit); orbitBtn.setAttribute('aria-pressed', String(autoOrbit)); };
    document.getElementById('reset-btn').onclick = closeFeature;
    document.getElementById('info-collapse-btn').onclick = () => document.getElementById('info-body').classList.toggle('hidden');
    document.getElementById('dock-toggle-btn').onclick = (e) => {
      const d = document.getElementById('dock-panel');
      d.classList.toggle('hidden');
      e.target.textContent = d.classList.contains('hidden') ? '▴ Show Controls' : '▾ Hide Controls';
    };
    window.addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.key === 'n' || e.key === 'N') narrateBtn.click();
    });
    controls.addEventListener('start', () => { camGoal = null; });
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    let lastT = performance.now(), elapsed = 0;
    const _off = new THREE.Vector3(), _sph = new THREE.Spherical(), _bDum = new THREE.Object3D(), _pv = new THREE.Vector3();
    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now(), dt = Math.min(0.1, (now - lastT) / 1000); lastT = now; elapsed += dt;
      if (isPlaying) {
        year += dt * 6.5;
        if (year >= MAX_YEAR) { year = MAX_YEAR; isPlaying = false; playBtn.textContent = 'Play'; }
      }
      if (cycleTod) {
        currentTod = (currentTod + dt * 0.055) % 1;
        targetTod = currentTod;
      } else {
        let delta = targetTod - currentTod;
        if (delta > 0.5) delta -= 1;
        if (delta < -0.5) delta += 1;
        currentTod = (currentTod + delta * (1 - Math.exp(-5 * dt)) + 1) % 1;
      }
      if (camGoal) {
        const a = 1 - Math.exp(-6.0 * dt);
        controls.target.lerp(camGoal.tgt, a);
        const curR = Math.hypot(camera.position.x, camera.position.z);
        const tgtR = Math.hypot(camGoal.pos.x, camGoal.pos.z);
        if (curR > 1 && tgtR > 1) {
          const curTheta = Math.atan2(camera.position.x, camera.position.z);
          const tgtTheta = Math.atan2(camGoal.pos.x, camGoal.pos.z);
          let dTheta = tgtTheta - curTheta;
          while (dTheta > Math.PI) dTheta -= Math.PI * 2;
          while (dTheta <= -Math.PI) dTheta += Math.PI * 2;
          const th = curTheta + dTheta * a;
          const yn = THREE.MathUtils.lerp(camera.position.y, camGoal.pos.y, a);
          const br = THREE.MathUtils.lerp(curR, tgtR, a);
          const sf = yn < 38 && Math.abs(dTheta) > 0.25 ? Math.min(1, (Math.abs(dTheta) - 0.25) / 1.0) : 0;
          const minR = 34.5 * sf;
          const nr = br < minR ? THREE.MathUtils.lerp(br, minR, Math.min(1, a * 1.85)) : br;
          camera.position.set(Math.sin(th) * nr, yn, Math.cos(th) * nr);
        } else {
          camera.position.lerp(camGoal.pos, a);
        }
        if (camera.position.distanceTo(camGoal.pos) < 0.25 && controls.target.distanceTo(camGoal.tgt) < 0.2) {
          camera.position.copy(camGoal.pos); controls.target.copy(camGoal.tgt); camGoal = null;
        }
      } else if (autoOrbit) {
        _off.copy(camera.position).sub(controls.target); _sph.setFromVector3(_off);
        _sph.theta += dt * 0.16; _off.setFromSpherical(_sph);
        camera.position.copy(controls.target).add(_off);
      }
      const atmos = applyTimeOfDay(currentTod);
      updateSceneAndHud(elapsed, atmos);
      for (const f of FEATURES) {
        const el = pinEls.get(f.id);
        if (!el) continue;
        const ok = labelsVisible && (focusMode || year >= f.reveal - 2 || selectedFeatureId === f.id);
        if (!ok) { el.style.opacity = '0'; el.style.pointerEvents = 'none'; continue; }
        _pv.set(...f.anchor).project(camera);
        if (_pv.z > 1 || _pv.z < -1) { el.style.opacity = '0'; el.style.pointerEvents = 'none'; continue; }
        const sx = ((_pv.x + 1) * 0.5) * window.innerWidth, sy = ((-_pv.y + 1) * 0.5) * window.innerHeight;
        if (sx < 40 || sx > window.innerWidth - 40 || sy < 24 || sy > window.innerHeight - 120) { el.style.opacity = '0'; el.style.pointerEvents = 'none'; continue; }
        el.style.transform = `translate3d(${Math.round(sx)}px,${Math.round(sy)}px,0)`;
        el.style.opacity = (year >= f.reveal - 2 || selectedFeatureId === f.id) ? '1' : '0.58';
        el.style.pointerEvents = 'auto';
      }

      // Step dusk/night rain & mist particles + bird flocking
      let rOp = 0, fOp = 0;
      if (weatherMode === 'auto') {
        fOp = Math.max(THREE.MathUtils.smoothstep(atmos.duskF, 0.08, 0.45) * 0.42, THREE.MathUtils.smoothstep(atmos.nightF, 0.08, 0.4) * 0.34);
        rOp = Math.max(THREE.MathUtils.smoothstep(atmos.nightF, 0.25, 0.9) * 0.43, THREE.MathUtils.smoothstep(atmos.duskF, 0.45, 0.95) * 0.15);
      } else if (weatherMode === 'rain') {
        rOp = 0.32 + (atmos.duskF * 0.85 + atmos.nightF) * 0.24; fOp = 0.2;
      } else if (weatherMode === 'fog') {
        fOp = 0.45;
      }
      rainLines.visible = rOp > 0.01;
      if (rainLines.visible) {
        rainMat.opacity = rOp;
        rainMat.color.setHex(atmos.nightF > 0.4 ? 0x8db0df : 0xffe0bc);
        for (let i = 0; i < RAIN_N; i++) {
          const d = rainData[i];
          d.x -= 2.6 * dt; d.z += 1.2 * dt; d.y -= 25 * d.spd * dt;
          if (d.y < 0) d.y += 56;
          if (d.x < -48) d.x += 96;
          if (d.z > 48) d.z -= 96;
          const k = i * 6;
          rainPos[k] = d.x; rainPos[k + 1] = d.y; rainPos[k + 2] = d.z;
          rainPos[k + 3] = d.x + 0.1 * d.len; rainPos[k + 4] = d.y + d.len; rainPos[k + 5] = d.z - 0.05 * d.len;
        }
        rainAttr.needsUpdate = true;
      }
      fogPts.visible = fOp > 0.01;
      if (fogPts.visible) {
        fogMat.opacity = fOp;
        for (let i = 0; i < FOG_N; i++) {
          const w = fogData[i];
          w.x -= 1.4 * w.s * dt; w.z += 0.65 * w.s * dt;
          if (w.x < -56) w.x += 112;
          if (w.z > 56) w.z -= 112;
          fogPos[i * 3] = w.x; fogPos[i * 3 + 1] = w.y + Math.sin(elapsed * 0.4 + w.p) * 0.45; fogPos[i * 3 + 2] = w.z;
        }
        fogAttr.needsUpdate = true;
      }
      birdB.visible = birdsEnabled; birdWL.visible = birdsEnabled; birdWR.visible = birdsEnabled;
      if (birdsEnabled) {
        for (let i = 0; i < BIRD_N; i++) {
          const b = birds[i];
          const rH = Math.hypot(b.x, b.z) || 0.01, rx = b.x / rH, rz = b.z / rH;
          b.vx += (-rz * b.dir * 3.8 + rx * (b.r - rH) * 0.7) * dt;
          b.vz += (rx * b.dir * 3.8 + rz * (b.r - rH) * 0.7) * dt;
          b.vy += ((b.by + Math.sin(elapsed * 0.55 + b.ph * 0.25) * 2.5) - b.y) * dt;
          const sp = Math.hypot(b.vx, b.vy, b.vz) || 1, tgt = b.hi === 0 ? 8.5 : 6.5;
          b.vx = (b.vx / sp) * tgt; b.vy = (b.vy / sp) * tgt; b.vz = (b.vz / sp) * tgt;
          b.x += b.vx * dt; b.y = Math.max(4.5, Math.min(48, b.y + b.vy * dt)); b.z += b.vz * dt;
          b.ph += b.ws * dt;
          const yaw = Math.atan2(b.vx, b.vz), flap = Math.sin(b.ph) * 0.68;
          _bDum.position.set(b.x, b.y, b.z); _bDum.scale.setScalar(b.sc);
          _bDum.rotation.set(0, yaw, b.bank, 'YXZ'); _bDum.updateMatrix(); birdB.setMatrixAt(i, _bDum.matrix);
          _bDum.rotation.set(0, yaw, b.bank + flap, 'YXZ'); _bDum.updateMatrix(); birdWL.setMatrixAt(i, _bDum.matrix);
          _bDum.rotation.set(0, yaw, b.bank - flap, 'YXZ'); _bDum.updateMatrix(); birdWR.setMatrixAt(i, _bDum.matrix);
        }
        birdB.instanceMatrix.needsUpdate = true; birdWL.instanceMatrix.needsUpdate = true; birdWR.instanceMatrix.needsUpdate = true;
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
